version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mikrotik_api
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://isp:isp@db:5432/mikrotik_api?schema=public
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: mikrotik_api_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=isp
      - POSTGRES_PASSWORD=isp
      - POSTGRES_DB=mikrotik_api
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isp -d mikrotik_api"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
