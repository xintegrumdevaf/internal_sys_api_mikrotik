name: CI/CD Deploy to Coolify

on:
  push:
    branches:
      - main
      - test

jobs:
  validate-and-deploy:
    name: Validate Code and Trigger Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Build and Typecheck
        run: pnpm run build

      - name: Trigger Coolify Webhook Deployment
        if: success()
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "Triggering redeploy for production (main)..."
            curl -s -X GET "${{ secrets.COOLIFY_WEBHOOK_URL_MAIN }}"
          elif [ "${{ github.ref_name }}" = "test" ]; then
            echo "Triggering redeploy for staging (test)..."
            curl -s -X GET "${{ secrets.COOLIFY_WEBHOOK_URL_TEST }}"
          fi
